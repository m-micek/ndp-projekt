
name: NDP Bash CI

on:

  pull_request:

    branches: [main]

  push:

    branches: [main]

  workflow_dispatch:

permissions:

  contents: read

jobs:

  test:

    runs-on: ubuntu-latest

    timeout-minutes: 5

    steps:

      - uses: actions/checkout@v4

      - name: Check Bash

        shell: bash

        run: bash scripts/check.sh

